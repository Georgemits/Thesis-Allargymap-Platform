version: "3.9"

services:

  mongo:
    image: mongo:7
    container_name: allergymap_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: allergymap
    volumes:
      - mongo_data:/data/db
      - ./mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: allergymap_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      MONGO_URI: mongodb://mongo:27017/allergymap
      SECRET_KEY: ${SECRET_KEY:-change-me}
    ports:
      - "5000:5000"

  seeder:
    build:
      context: ..
      dockerfile: docker/Dockerfile.seeder
    container_name: allergymap_seeder
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/allergymap

  frontend:
    image: nginx:alpine
    container_name: allergymap_frontend
    restart: unless-stopped
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
