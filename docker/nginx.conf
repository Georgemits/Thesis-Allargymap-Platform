# Local development front door.
#
# nginx serves the static frontend and proxies /api to the backend container,
# so the browser talks to a single origin -- exactly as it does in the
# deployed single-service setup, where Flask serves both. Keeping the two
# environments on the same shape means CORS, cookies and relative URLs behave
# identically in development and in production, instead of only being
# exercised for the first time after deployment.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, queried per request rather than once at startup.
    # With a literal upstream name, nginx refuses to start when the backend is
    # not up yet -- so a backend problem would take the frontend down with it.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend backend;
        proxy_pass http://$backend:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $backend_health backend;
        proxy_pass http://$backend_health:5000/health;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
