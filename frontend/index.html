<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllergyMap — Live Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <span class="brand">AllergyMap</span>
    <button class="navbar-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="navbar-links">
      <a href="index.html" class="active">Map</a>
      <a href="report.html">Report Symptoms</a>
      <a href="dashboard.html">Dashboard</a>
    </div>
  </nav>

  <div id="map"></div>

  <div class="legend card" id="allergenLegend">
    <label class="legend-select-label">Allergen:
      <select id="allergenSelect">
        <option value="olive" selected>Olive pollen</option>
        <option value="grass">Grass pollen</option>
        <option value="ragweed">Ragweed pollen</option>
        <option value="dust">Saharan dust</option>
      </select>
    </label>
    <div id="legendGradientWrap">
      <div class="legend-gradient"></div>
      <div class="legend-scale">
        <span>0</span>
        <span id="legendMax">–</span>
      </div>
    </div>
    <p id="legendStatus" class="legend-note hidden"></p>
    <p class="legend-note">City-level readings (10 Greek cities), most recent available value per city, blurred into a heatmap for display.</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="js/navbar.js"></script>
  <script src="env.local.js"></script><!-- optional, gitignored: local API base override -->
  <script src="js/identity.js"></script>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
